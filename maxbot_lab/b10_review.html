<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B10 Trade Space Grade Review</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#131722;color:#d1d4dc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px}
#toolbar{padding:6px 10px;border-bottom:1px solid #2a2e39;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#toolbar h1{font-size:13px;font-weight:600;color:#fff;margin-right:8px}
#toolbar select{background:#1e222d;color:#d1d4dc;border:1px solid #2a2e39;padding:5px 8px;border-radius:4px;font-size:11px;max-width:420px}
.tb-btn{background:#1e222d;color:#d1d4dc;border:1px solid #2a2e39;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.tb-btn:hover{border-color:#4c525e}
.tb-btn.active{background:#2962ff;border-color:#2962ff;color:#fff}
.tb-btn.warn{background:#ff5722;border-color:#ff5722;color:#fff}
.tb-sep{width:1px;height:20px;background:#2a2e39;margin:0 4px}
#info-bar{padding:6px 10px;border-bottom:1px solid #2a2e39;display:flex;gap:16px;flex-wrap:wrap;font-size:11px}
.ib-item{display:flex;gap:3px}.ib-label{color:#787b86}.ib-val{font-weight:600}
.grade-A{color:#26a69a}.grade-B_PLUS{color:#FF9800}.grade-B{color:#ef5350}
#chart-container{width:100%;height:calc(100vh - 230px);min-height:350px}
#zone-panel{padding:6px 10px;border-top:1px solid #2a2e39;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#zone-panel select,#zone-panel input{background:#1e222d;color:#d1d4dc;border:1px solid #2a2e39;padding:3px 6px;border-radius:3px;font-size:11px}
#zone-panel input[type=number]{width:80px}
#zone-list{padding:4px 10px;border-top:1px solid #1e222d;font-size:11px;max-height:60px;overflow-y:auto}
.zl-row{display:flex;gap:10px;padding:2px 0;cursor:pointer}.zl-row:hover{background:#1e222d}.zl-row.sel{background:#2a2e39}
#legend{padding:4px 10px;border-top:1px solid #2a2e39;font-size:10px;display:flex;gap:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:3px}
.leg-box{width:12px;height:8px;border:1px solid}
</style>
</head>
<body>
<div id="toolbar">
  <h1>B10 Review</h1>
  <select id="case-select"></select>
  <span class="tb-sep"></span>
  <button class="tb-btn active" id="btnAnnotate" onclick="toggleAnnotation()">MAX ANNOTATION</button>
  <button class="tb-btn" id="btnFuture" onclick="toggleFuture()">SHOW FUTURE</button>
  <button class="tb-btn" id="btnBotWalls" onclick="toggleBotWalls()">SHOW BOT WALLS</button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="btnAddZone" onclick="startAddZone()">ADD ZONE</button>
  <button class="tb-btn" onclick="deleteZone()">DELETE</button>
  <button class="tb-btn" onclick="clearZones()">CLEAR</button>
  <button class="tb-btn" onclick="exportAnnotations()">EXPORT</button>
  <button class="tb-btn" onclick="importAnnotations()">IMPORT</button>
</div>
<div id="info-bar"></div>
<div id="chart-container"></div>
<div id="zone-panel">
  <span class="ib-label">Selected:</span>
  <span id="selZoneId" class="ib-val">—</span>
  <span class="ib-label">Lower:</span><input type="number" step="0.01" id="zoneLower" onchange="updateZoneBounds()">
  <span class="ib-label">Upper:</span><input type="number" step="0.01" id="zoneUpper" onchange="updateZoneBounds()">
  <span class="ib-label">Class:</span>
  <select id="zoneClass" onchange="updateZoneMeta()">
    <option value="UNSURE">UNSURE</option>
    <option value="RESISTANCE">RESISTANCE</option>
    <option value="SUPPORT">SUPPORT</option>
    <option value="FLIP">FLIP</option>
  </select>
  <span class="ib-label">Tags:</span>
  <select id="zoneTags" multiple size="1" onchange="updateZoneMeta()" style="width:140px;height:22px">
    <option>SWING_HIGH</option><option>SWING_LOW</option><option>REPEATED_WICKS</option>
    <option>REJECTION</option><option>CONSOLIDATION</option><option>BREAK_RETEST</option>
    <option>OCL</option><option>PRIOR_LEVEL</option><option>OTHER</option>
  </select>
</div>
<div id="zone-list"></div>
<div id="legend">
  <span class="leg"><span class="leg-box" style="background:rgba(0,150,255,0.15);border-color:#0096ff"></span> Max Zone</span>
  <span class="leg"><span style="color:#2196F3;font-size:12px">&#9660;</span> Break</span>
  <span class="leg"><span style="color:#FFD700;font-size:12px">&#9650;</span> Entry</span>
  <span class="leg"><span class="leg-box" style="background:#FFD70044;border-color:#FFD700"></span> Entry</span>
  <span class="leg"><span class="leg-box" style="background:#ef535044;border-color:#ef5350"></span> Stop</span>
  <span class="leg"><span class="leg-box" style="background:#26a69a44;border-color:#26a69a"></span> Target</span>
  <span class="leg"><span class="leg-box" style="background:#ff572244;border-color:#ff5722"></span> Nearest Wall</span>
  <span class="leg"><span class="leg-box" style="background:#9C27B022;border-color:#9C27B0"></span> Other Wall</span>
</div>

let chart = null, series = null;
let annotationMode = true, showFuture = false, showBotWalls = false;
let manualZones = []; // {id, lower, upper, classification, tags, seriesUpper, seriesLower}
let zoneCounter = 0, selectedZoneIdx = -1;
let addingZone = false, firstClick = null;
const sel = document.getElementById('case-select');

// Populate selector
CASES.forEach((c, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = c.symbol + ' \u2014 ' + c.date + ' \u2014 ' + c.direction + ' \u2014 ' + c.grade.replace('_',' ') + ' \u2014 ' + c.outcome;
  sel.appendChild(opt);
});
sel.addEventListener('change', () => { manualZones = []; zoneCounter = 0; selectedZoneIdx = -1; render(); });

function currentCase() { return CASES[sel.value]; }

function toggleAnnotation() {
  annotationMode = !annotationMode;
  document.getElementById('btnAnnotate').classList.toggle('active', annotationMode);
  render();
}
function toggleFuture() {
  showFuture = !showFuture;
  document.getElementById('btnFuture').classList.toggle('active', showFuture);
  render();
}
function toggleBotWalls() {
  showBotWalls = !showBotWalls;
  document.getElementById('btnBotWalls').classList.toggle('active', showBotWalls);
  render();
}

function render() {
  const c = currentCase();
  const isLong = c.direction === 'LONG';
  const hideOutcome = annotationMode && !showFuture;

  // Info bar
  const gp = document.getElementById('info-bar');
  const dirCls = isLong ? 'grade-A' : 'grade-B';
  let info = '<div class="ib-item"><span class="ib-label">Case:</span><span class="ib-val">' + (parseInt(sel.value)+1) + '/' + CASES.length + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Symbol:</span><span class="ib-val">' + c.symbol + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Date:</span><span class="ib-val">' + c.date + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Dir:</span><span class="ib-val" style="color:' + (isLong?'#26a69a':'#ef5350') + '">' + c.direction + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">TF:</span><span class="ib-val">' + c.timeframe + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Entry:</span><span class="ib-val">' + c.entry_price.toFixed(2) + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Stop:</span><span class="ib-val" style="color:#ef5350">' + c.stop_price.toFixed(2) + '</span></div>';
  info += '<div class="ib-item"><span class="ib-label">Risk:</span><span class="ib-val">' + c.risk_ticks + 't</span></div>';

  if (!hideOutcome) {
    info += '<div class="ib-item"><span class="ib-label">Target:</span><span class="ib-val" style="color:#26a69a">' + c.target_price.toFixed(2) + '</span></div>';
    info += '<div class="ib-item"><span class="ib-label">Outcome:</span><span class="ib-val" style="color:' + (c.outcome==='TARGET_HIT'?'#26a69a':'#ef5350') + '">' + c.outcome + '</span></div>';
  }
  if (showBotWalls) {
    info += '<div class="ib-item"><span class="ib-label">Grade:</span><span class="ib-val grade-' + c.grade + '">' + c.grade.replace('_',' ') + '</span></div>';
    info += '<div class="ib-item"><span class="ib-label">Walls:</span><span class="ib-val">' + c.active_wall_count + '</span></div>';
    const nr = c.nearest_wall_distance_ticks !== null ? c.nearest_wall_distance_ticks + 't/' + c.nearest_wall_distance_r.toFixed(2) + 'R' : 'N/A';
    info += '<div class="ib-item"><span class="ib-label">Nearest:</span><span class="ib-val">' + nr + '</span></div>';
  }
  gp.innerHTML = info;

  // Chart
  const container = document.getElementById('chart-container');
  if (chart) { chart.remove(); chart = null; series = null; }

  chart = LightweightCharts.createChart(container, {
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
  });

  series = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });

  // Filter candles: in annotation mode with future hidden, cut at entry
  let visCandles = c.candles;
  if (annotationMode && !showFuture && c.entry_candle_time) {
    visCandles = c.candles.filter(cd => cd.time <= c.entry_candle_time);
  }
  series.setData(visCandles);

  // Price lines
  series.createPriceLine({ price: c.entry_price, color: '#FFD700', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'Entry' });
  series.createPriceLine({ price: c.stop_price, color: '#ef5350', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Stop' });
  if (!hideOutcome) {
    series.createPriceLine({ price: c.target_price, color: '#26a69a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Target' });
  }

  // Markers
  const markers = [];
  if (c.break_candle_time) {
    markers.push({ time: c.break_candle_time, position: isLong?'aboveBar':'belowBar', color: '#2196F3', shape: isLong?'arrowDown':'arrowUp', text: 'Break' });
  }
  if (c.entry_candle_time) {
    markers.push({ time: c.entry_candle_time, position: isLong?'belowBar':'aboveBar', color: '#FFD700', shape: isLong?'arrowUp':'arrowDown', text: 'Entry' });
  }

  // Bot wall contacts + zones — only when enabled
  if (showBotWalls) {
    if (c.wall_contact_times) {
      c.wall_contact_times.forEach(t => {
        if (!annotationMode || !showFuture || t <= (c.entry_candle_time||Infinity)) {
          markers.push({ time: t, position: isLong?'aboveBar':'belowBar', color: '#FF9800', shape: 'circle', text: '' });
        }
      });
    }
    c.walls.forEach(w => {
      if (!w.is_active || !w.is_between_entry_and_target) return;
      const color = w.is_nearest ? '#ff5722' : '#9C27B0';
      const addWallLine = (price) => {
        const ls = chart.addLineSeries({ color, lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
        ls.setData(visCandles.map(cd => ({ time: cd.time, value: price })));
      };
      addWallLine(w.upper_price);
      addWallLine(w.lower_price);
    });
  }

  markers.sort((a,b) => a.time - b.time);
  if (markers.length) series.setMarkers(markers);

  // Manual zones
  manualZones.forEach(z => {
    z.seriesUpper = chart.addLineSeries({ color:'#0096ff', lineWidth:2, lineStyle:0, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
    z.seriesUpper.setData(visCandles.map(cd => ({ time: cd.time, value: z.upper })));
    z.seriesLower = chart.addLineSeries({ color:'#0096ff', lineWidth:2, lineStyle:0, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
    z.seriesLower.setData(visCandles.map(cd => ({ time: cd.time, value: z.lower })));
  });

  chart.timeScale().fitContent();
  renderZoneList();

  // Click handler for adding zones
  chart.subscribeCrosshairMove(param => {
    if (!addingZone || !param.point) return;
    // visual feedback could go here
  });
  chart.subscribeClick(param => {
    if (!addingZone || !param.point) return;
    const price = series.coordinateToPrice(param.point.y);
    if (price === null || price === undefined) return;
    if (firstClick === null) {
      firstClick = Math.round(price * 100) / 100;
      document.getElementById('btnAddZone').textContent = 'Click 2nd bound...';
    } else {
      const p2 = Math.round(price * 100) / 100;
      const lo = Math.min(firstClick, p2);
      const hi = Math.max(firstClick, p2);
      zoneCounter++;
      manualZones.push({ id: 'Z' + zoneCounter, lower: lo, upper: hi, classification: 'UNSURE', tags: [], seriesUpper: null, seriesLower: null });
      firstClick = null; addingZone = false;
      document.getElementById('btnAddZone').textContent = 'ADD ZONE';
      document.getElementById('btnAddZone').classList.remove('warn');
      selectedZoneIdx = manualZones.length - 1;
      render();
    }
  });
}

function startAddZone() {
  addingZone = true; firstClick = null;
  document.getElementById('btnAddZone').textContent = 'Click 1st bound...';
  document.getElementById('btnAddZone').classList.add('warn');
}

function deleteZone() {
  if (selectedZoneIdx < 0 || selectedZoneIdx >= manualZones.length) return;
  manualZones.splice(selectedZoneIdx, 1);
  selectedZoneIdx = -1;
  render();
}

function clearZones() {
  if (manualZones.length === 0) return;
  manualZones = []; zoneCounter = 0; selectedZoneIdx = -1;
  render();
}

function renderZoneList() {
  const el = document.getElementById('zone-list');
  if (!manualZones.length) { el.innerHTML = '<span style="color:#787b86">No manual zones drawn.</span>'; return; }
  el.innerHTML = manualZones.map((z, i) =>
    '<div class="zl-row' + (i===selectedZoneIdx?' sel':'') + '" onclick="selectZone(' + i + ')">' +
    '<span style="color:#0096ff;font-weight:600;width:30px">' + z.id + '</span>' +
    '<span style="width:100px">' + z.lower.toFixed(2) + ' — ' + z.upper.toFixed(2) + '</span>' +
    '<span style="width:80px;color:#787b86">' + z.classification + '</span>' +
    '<span style="color:#787b86">' + (z.tags.length ? z.tags.join(', ') : '') + '</span>' +
    '</div>'
  ).join('');
  updateZoneInputs();
}

function selectZone(i) {
  selectedZoneIdx = i;
  renderZoneList();
}

function updateZoneInputs() {
  const z = manualZones[selectedZoneIdx];
  document.getElementById('selZoneId').textContent = z ? z.id : '\u2014';
  document.getElementById('zoneLower').value = z ? z.lower.toFixed(2) : '';
  document.getElementById('zoneUpper').value = z ? z.upper.toFixed(2) : '';
  if (z) {
    document.getElementById('zoneClass').value = z.classification;
    const tagSel = document.getElementById('zoneTags');
    Array.from(tagSel.options).forEach(o => { o.selected = z.tags.includes(o.value); });
  }
}

function updateZoneBounds() {
  if (selectedZoneIdx < 0) return;
  const z = manualZones[selectedZoneIdx];
  const lo = parseFloat(document.getElementById('zoneLower').value);
  const hi = parseFloat(document.getElementById('zoneUpper').value);
  if (!isNaN(lo)) z.lower = lo;
  if (!isNaN(hi)) z.upper = hi;
  render();
}

function updateZoneMeta() {
  if (selectedZoneIdx < 0) return;
  const z = manualZones[selectedZoneIdx];
  z.classification = document.getElementById('zoneClass').value;
  const tagSel = document.getElementById('zoneTags');
  z.tags = Array.from(tagSel.selectedOptions).map(o => o.value);
  renderZoneList();
}

function exportAnnotations() {
  const c = currentCase();
  const payload = {
    case: { symbol: c.symbol, session_date: c.date, direction: c.direction, timeframe: c.timeframe, entry_price: c.entry_price, entry_candle_time: c.entry_candle_time },
    manual_zones: manualZones.map(z => ({ id: z.id, lower_price: z.lower, upper_price: z.upper, classification: z.classification, reason_tags: z.tags }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = c.symbol + '_' + c.date + '_' + c.direction + '_zones.json';
  a.click();
}

function importAnnotations() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.manual_zones || !Array.isArray(data.manual_zones)) { alert('Invalid format'); return; }
        manualZones = data.manual_zones.map((z, i) => ({
          id: z.id || ('Z' + (i+1)),
          lower: z.lower_price, upper: z.upper_price,
          classification: z.classification || 'UNSURE',
          tags: z.reason_tags || [],
          seriesUpper: null, seriesLower: null,
        }));
        zoneCounter = manualZones.length;
        selectedZoneIdx = manualZones.length > 0 ? 0 : -1;
        render();
      } catch(err) { alert('Parse error: ' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Boot
if (CASES.length) render();
