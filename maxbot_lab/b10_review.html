let chart = null;
const sel = document.getElementById('case-select');

CASES.forEach((c, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = c.symbol + ' — ' + c.date + ' — ' + c.direction + ' — ' + c.grade.replace('_',' ') + ' — ' + c.outcome;
  sel.appendChild(opt);
});

sel.addEventListener('change', () => render(CASES[sel.value]));

function render(c) {
  // Grade panel
  const gp = document.getElementById('grade-panel');
  const dirCls = c.direction === 'LONG' ? 'long' : 'short';
  const outCls = c.outcome === 'TARGET_HIT' ? 'win' : 'loss';
  const nearTxt = c.nearest_wall_distance_ticks !== null
    ? c.nearest_wall_distance_ticks + 't / ' + c.nearest_wall_distance_r.toFixed(2) + 'R'
    : 'N/A';
  gp.innerHTML = `
    <div class="gp-item"><span class="gp-label">Grade:</span><span class="gp-value grade-${c.grade}">${c.grade.replace('_',' ')}</span></div>
    <div class="gp-item"><span class="gp-label">Reason:</span><span class="gp-value">${c.reason.replace(/_/g,' ')}</span></div>
    <div class="gp-item"><span class="gp-label">Symbol:</span><span class="gp-value">${c.symbol}</span></div>
    <div class="gp-item"><span class="gp-label">Date:</span><span class="gp-value">${c.date}</span></div>
    <div class="gp-item"><span class="gp-label">Dir:</span><span class="gp-value ${dirCls}">${c.direction}</span></div>
    <div class="gp-item"><span class="gp-label">TF:</span><span class="gp-value">${c.timeframe}</span></div>
    <div class="gp-item"><span class="gp-label">Entry:</span><span class="gp-value">${c.entry_price.toFixed(2)}</span></div>
    <div class="gp-item"><span class="gp-label">Stop:</span><span class="gp-value" style="color:#ef5350">${c.stop_price.toFixed(2)}</span></div>
    <div class="gp-item"><span class="gp-label">Target:</span><span class="gp-value" style="color:#26a69a">${c.target_price.toFixed(2)}</span></div>
    <div class="gp-item"><span class="gp-label">Risk:</span><span class="gp-value">${c.risk_ticks}t</span></div>
    <div class="gp-item"><span class="gp-label">Walls:</span><span class="gp-value">${c.active_wall_count}</span></div>
    <div class="gp-item"><span class="gp-label">Nearest:</span><span class="gp-value">${nearTxt}</span></div>
    <div class="gp-item"><span class="gp-label">Outcome:</span><span class="gp-value ${outCls}">${c.outcome}</span></div>
  `;

  // Chart
  const container = document.getElementById('chart-container');
  if (chart) { chart.remove(); chart = null; }

  chart = LightweightCharts.createChart(container, {
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
  });

  const series = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  series.setData(c.candles);

  // Price lines: entry, stop, target
  series.createPriceLine({ price: c.entry_price, color: '#FFD700', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'Entry' });
  series.createPriceLine({ price: c.stop_price, color: '#ef5350', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Stop' });
  series.createPriceLine({ price: c.target_price, color: '#26a69a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Target' });

  // Wall zones — active walls between entry and target
  c.walls.forEach(w => {
    if (!w.is_active || !w.is_between_entry_and_target) return;
    const color = w.is_nearest ? 'rgba(255,87,34,0.25)' : 'rgba(156,39,176,0.15)';
    const borderColor = w.is_nearest ? '#ff5722' : '#9C27B0';

    // Upper bound line
    const upperLine = chart.addLineSeries({
      color: borderColor, lineWidth: 1, lineStyle: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    upperLine.setData(c.candles.map(cd => ({ time: cd.time, value: w.upper_price })));

    // Lower bound line
    const lowerLine = chart.addLineSeries({
      color: borderColor, lineWidth: 1, lineStyle: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    lowerLine.setData(c.candles.map(cd => ({ time: cd.time, value: w.lower_price })));
  });

  chart.timeScale().fitContent();
}

// Boot: render first case
if (CASES.length) render(CASES[0]);
