<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/manifest.json">
<title>MaxBot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#14141f;--card:#1a1a2a;--border:#2a2a3a;
  --text:#e8e8f0;--dim:#7a7a8f;--accent:#4f8cff;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#06b6d4;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}

/* Header */
.header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700;letter-spacing:1px}
.header .mode-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.mode-paper{background:#22c55e22;color:var(--green)}
.mode-observe{background:#06b6d422;color:var(--cyan)}
.mode-stopped{background:#7a7a8f22;color:var(--dim)}

/* State chip */
.state-chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.state-running{background:#22c55e22;color:var(--green)}
.state-stopped{background:#7a7a8f22;color:var(--dim)}
.state-starting,.state-stopping{background:#f59e0b22;color:var(--amber)}
.state-error{background:#ef444422;color:var(--red)}

/* Sections */
.section{padding:12px 16px}
.section-title{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}

/* Symbol cards */
.sym-card{display:flex;justify-content:space-between;align-items:center}
.sym-name{font-weight:700;font-size:15px}
.sym-state{font-size:12px;font-weight:500}
.sym-detail{font-size:12px;color:var(--dim);margin-top:4px}
.sym-levels{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}

/* Active trade card */
.active-card{border-left:3px solid var(--accent)}
.active-card .sym-name{color:var(--accent)}

/* Timeline */
.timeline{max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.event{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.event:last-child{border-bottom:none}
.event-time{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;margin-right:6px}
.event-sym{font-weight:600;margin-right:4px}
.event-high{font-weight:600}
.event-win{color:var(--green)}
.event-loss{color:var(--red)}
.event-signal{color:var(--accent)}
.event-trigger{color:var(--amber)}

/* Controls */
.controls{padding:12px 16px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;margin-bottom:8px}
.btn-start{background:var(--green);color:#000}
.btn-stop{background:var(--red);color:#fff}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Config form */
.config{padding:0 16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field select,.field input{width:100%;padding:10px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:14px}

/* Summary bar */
.summary{display:flex;gap:12px;flex-wrap:wrap;padding:8px 16px}
.stat{text-align:center;flex:1;min-width:60px}
.stat-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase}

/* Connection lost */
.conn-lost{background:var(--red);color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:600}

/* Confirm modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:320px;width:100%}
.modal h3{font-size:16px;margin-bottom:12px}
.modal p{font-size:14px;color:var(--dim);margin-bottom:16px}
.modal .btn{margin-bottom:6px}

/* Settings */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.settings-row label{font-size:12px;color:var(--dim)}
.settings-row input{width:180px;padding:6px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:12px}

/* Journal */
.perf-grid{display:flex;gap:8px;margin-bottom:8px}
.perf-card{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.perf-period{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.perf-pnl{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0;overflow-wrap:anywhere}
.perf-meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.pnl-pos{color:var(--green)}
.pnl-neg{color:var(--red)}
.pnl-none{color:var(--dim)}
.perf-note{font-size:10px;color:var(--dim);margin-bottom:8px;line-height:1.35}
.perf-counters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;background:#7a7a8f22;color:var(--dim);white-space:nowrap}
.chip-attn{background:#f59e0b22;color:var(--amber)}
.chip-open{background:#4f8cff22;color:var(--accent)}

.jrn-list{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.jrn{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.jrn-win{border-left-color:var(--green)}
.jrn-loss{border-left-color:var(--red)}
.jrn-open{border-left-color:var(--accent)}
.jrn-attn{border-left-color:var(--amber)}
.jrn-legacy{border-left-color:var(--dim);opacity:.72}
.jrn-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jrn-sym{font-weight:700;font-size:15px}
.jrn-dir{font-size:11px;font-weight:600;color:var(--dim);margin-left:5px}
.jrn-pnl{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.jrn-sub{font-size:11px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.jrn-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;text-transform:uppercase;margin-top:5px}
.badge-win{background:#22c55e22;color:var(--green)}
.badge-loss{background:#ef444422;color:var(--red)}
.badge-open{background:#4f8cff22;color:var(--accent)}
.badge-attn{background:#f59e0b22;color:var(--amber)}
.badge-legacy{background:#7a7a8f22;color:var(--dim)}
.jrn-det{margin-top:6px}
.jrn-det summary{font-size:11px;color:var(--accent);cursor:pointer;list-style:none;padding:2px 0}
.jrn-det summary::-webkit-details-marker{display:none}
.jrn-det summary::after{content:' \25BE'}
.jrn-det[open] summary::after{content:' \25B4'}
.jrn-kv{font-size:11px;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between;gap:10px}
.jrn-kv span:last-child{color:var(--text);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.jrn-empty{font-size:13px;color:var(--dim);padding:6px 0}

.hidden{display:none !important}
</style>
</head>
<body>

<div id="conn-lost" class="conn-lost hidden">CONNECTION LOST — retrying…</div>

<div class="header">
  <h1>MAXBOT</h1>
  <span id="mode-badge" class="mode-badge mode-stopped">STOPPED</span>
</div>

<!-- Bot state + summary -->
<div class="section">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <span id="state-chip" class="state-chip state-stopped">STOPPED</span>
    <span id="conn-info" style="font-size:11px;color:var(--dim)"></span>
  </div>
  <div id="error-msg" class="hidden" style="padding:8px 12px;margin-top:4px;background:#ef444422;border:1px solid var(--red);border-radius:6px;color:var(--red);font-size:13px"></div>
</div>

<div id="summary-bar" class="summary hidden">
  <div class="stat"><div id="stat-symbols" class="stat-value">0</div><div class="stat-label">Symbols</div></div>
  <div class="stat"><div id="stat-trades" class="stat-value">0</div><div class="stat-label">Trades</div></div>
  <div class="stat"><div id="stat-wins" class="stat-value">0</div><div class="stat-label">Wins</div></div>
  <div class="stat"><div id="stat-losses" class="stat-value">0</div><div class="stat-label">Losses</div></div>
  <div class="stat"><div id="stat-open" class="stat-value">0</div><div class="stat-label">Open</div></div>
</div>

<!-- Test mode label -->
<div id="test-label" class="hidden" style="text-align:center;padding:4px;font-size:11px;color:var(--amber);background:#f59e0b11">TEST MODE — TRADE LIMITS OFF</div>

<!-- Active trades -->
<div id="active-section" class="section hidden">
  <div class="section-title">Active Trades</div>
  <div id="active-trades"></div>
</div>

<!-- Config (when stopped) -->
<div id="config-section">
  <div class="config">
    <div class="field">
      <label>Execution Mode</label>
      <select id="cfg-mode"><option value="PAPER_EXECUTE">PAPER EXECUTE</option><option value="OBSERVE_ONLY">OBSERVE ONLY</option></select>
    </div>
    <div class="field">
      <label>Direction</label>
      <select id="cfg-dir"><option value="BOTH" selected>BOTH</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
    </div>
    <div class="field">
      <label>Watchlist (comma separated)</label>
      <!-- No hardcoded watchlist: the canonical defaults come from
           /api/bot/status (start_config.py), so manual START and the
           08:00 CT auto-start cannot drift apart. -->
      <input id="cfg-symbols" type="text" placeholder="loading defaults…" oninput="onSymbolsTyped()">
    </div>
  </div>
  <div class="controls">
    <button id="btn-start" class="btn btn-start" onclick="confirmStart()" disabled>LOADING…</button>
    <div id="cfg-warning" class="hidden" style="padding:8px 12px;margin-bottom:8px;background:#f59e0b22;border:1px solid var(--amber);border-radius:6px;color:var(--amber);font-size:13px"></div>
  </div>
</div>

<!-- Stop button (when running) -->
<div id="stop-section" class="controls hidden">
  <button id="btn-stop" class="btn btn-stop" onclick="doStop()">STOP MAXBOT</button>
</div>

<!-- Symbols -->
<div id="symbols-section" class="section hidden">
  <div class="section-title">Watchlist</div>
  <div id="symbol-cards"></div>
</div>

<!-- Event timeline -->
<div id="timeline-section" class="section hidden">
  <div class="section-title">Live Events</div>
  <div id="timeline" class="timeline"></div>
</div>

<!-- Export -->
<div id="export-section" class="section hidden">
  <div class="section-title">Session</div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-secondary" style="flex:1" onclick="exportJSON()">Export JSON</button>
    <button class="btn btn-secondary" style="flex:1" onclick="exportMD()">Export Report</button>
  </div>
</div>

<!-- Journal (persisted history — works with the bot stopped) -->
<div id="journal-section" class="section">
  <div class="section-title">Journal</div>
  <div id="perf-cards" class="perf-grid"></div>
  <div id="perf-note" class="perf-note"></div>
  <div id="perf-counters" class="perf-counters"></div>
  <div id="journal-list" class="jrn-list"><div class="jrn-empty">Loading…</div></div>
</div>

<!-- Settings -->
<div class="settings-row">
  <label>API Token</label>
  <input id="cfg-token" type="password" placeholder="optional" oninput="saveToken()">
</div>

<!-- Confirm modal -->
<div id="confirm-modal" class="modal-bg hidden">
  <div class="modal">
    <h3>Start MaxBot?</h3>
    <p id="confirm-text"></p>
    <button class="btn btn-start" onclick="doStart()">Confirm Start</button>
    <button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
  </div>
</div>

<script>
const API = '';
let lastSeq = 0;
let botState = 'STOPPED';
let pollTimer = null;
let connOk = true;

// Token
function getToken() { return localStorage.getItem('maxbot_token') || ''; }
function saveToken() { localStorage.setItem('maxbot_token', document.getElementById('cfg-token').value); }
document.getElementById('cfg-token').value = getToken();

function authHeaders() {
  const t = getToken();
  const h = {'Content-Type':'application/json'};
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

// ── Canonical START defaults ───────────────────────────────────────
// The form is populated from the server, once, on the first status
// that carries them. Applied once and never again: re-applying on
// every 2s poll would wipe whatever the user is typing.
let defaultsApplied = false;

function applyStartDefaults(d) {
  if (defaultsApplied || !d || !Array.isArray(d.symbols) || !d.symbols.length) return;
  document.getElementById('cfg-symbols').value = d.symbols.join(',');
  if (d.direction) document.getElementById('cfg-dir').value = d.direction;
  if (d.execution_mode) document.getElementById('cfg-mode').value = d.execution_mode;
  defaultsApplied = true;

  const btn = document.getElementById('btn-start');
  btn.disabled = false;
  btn.textContent = 'START MAXBOT';
  document.getElementById('cfg-warning').classList.add('hidden');
}

// Fail visibly, never silently: without defaults the form would send an
// empty watchlist, and a START must not be one tap away from that.
function warnDefaultsUnavailable() {
  if (defaultsApplied) return;
  const el = document.getElementById('cfg-warning');
  el.textContent = 'Start defaults unavailable \u2014 enter a watchlist manually to enable START.';
  el.classList.remove('hidden');
}

// Typing a watchlist by hand unblocks START even if the server never
// delivered defaults.
function onSymbolsTyped() {
  const has = document.getElementById('cfg-symbols').value
    .split(',').map(s => s.trim()).filter(Boolean).length > 0;
  const btn = document.getElementById('btn-start');
  btn.disabled = !has;
  btn.textContent = has ? 'START MAXBOT' : 'LOADING\u2026';
}

// Start flow
function confirmStart() {
  const mode = document.getElementById('cfg-mode').value;
  const dir = document.getElementById('cfg-dir').value;
  const syms = document.getElementById('cfg-symbols').value;
  if (!syms.split(',').map(s => s.trim()).filter(Boolean).length) {
    warnDefaultsUnavailable();
    return;
  }
  const modeLabel = mode === 'PAPER_EXECUTE' ? 'PAPER' : 'OBSERVE ONLY';
  document.getElementById('confirm-text').innerHTML =
    `<b>${modeLabel}</b><br>${syms.split(',').length} symbols<br>Direction: ${dir}<br>${mode === 'PAPER_EXECUTE' ? 'Orders: PAPER only' : 'No orders will be placed'}`;
  document.getElementById('confirm-modal').classList.remove('hidden');
}
function hideModal() { document.getElementById('confirm-modal').classList.add('hidden'); }

async function doStart() {
  hideModal();
  const symbols = document.getElementById('cfg-symbols').value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
  const body = {
    symbols,
    direction: document.getElementById('cfg-dir').value,
    execution_mode: document.getElementById('cfg-mode').value,
    trade_limits_enabled: false,
  };
  try {
    const r = await fetch(API + '/api/bot/start', {method:'POST', headers:authHeaders(), body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) {
      alert(d.error || 'Start failed');
    }
    // Always refresh status after start attempt
    setTimeout(pollStatus, 500);
  } catch(e) { alert('Start error: ' + e.message); }
}

async function doStop() {
  try {
    const r = await fetch(API + '/api/bot/stop', {method:'POST', headers:authHeaders()});
    const d = await r.json();
    if (!r.ok) alert(d.error || 'Stop failed');
  } catch(e) { alert('Stop error: ' + e.message); }
}

// Polling
async function pollStatus() {
  try {
    const r = await fetch(API + '/api/bot/status');
    if (!r.ok) throw new Error('status ' + r.status);
    const d = await r.json();
    connOk = true;
    document.getElementById('conn-lost').classList.add('hidden');
    updateStatus(d);
  } catch(e) {
    connOk = false;
    document.getElementById('conn-lost').classList.remove('hidden');
    warnDefaultsUnavailable();
  }
}

async function pollSymbols() {
  if (!connOk || botState === 'STOPPED') return;
  try {
    const r = await fetch(API + '/api/bot/symbols');
    if (r.ok) updateSymbols(await r.json());
  } catch(e) {}
}

async function pollEvents() {
  if (!connOk || botState === 'STOPPED') return;
  try {
    const r = await fetch(API + '/api/events?since=' + lastSeq);
    if (r.ok) {
      const events = await r.json();
      appendEvents(events);
    }
  } catch(e) {}
}

async function pollSession() {
  if (!connOk || botState === 'STOPPED') return;
  try {
    const r = await fetch(API + '/api/session');
    if (r.ok) updateSession(await r.json());
  } catch(e) {}
}

// Render
function updateStatus(d) {
  applyStartDefaults(d.start_defaults);
  const prev = botState;
  botState = d.state || 'STOPPED';
  const chip = document.getElementById('state-chip');
  chip.textContent = botState;
  chip.className = 'state-chip state-' + botState.toLowerCase();

  const badge = document.getElementById('mode-badge');
  const mode = d.execution_mode;
  if (botState === 'RUNNING' || botState === 'STARTING') {
    badge.textContent = mode === 'PAPER_EXECUTE' ? 'PAPER' : 'OBSERVE';
    badge.className = 'mode-badge ' + (mode === 'PAPER_EXECUTE' ? 'mode-paper' : 'mode-observe');
  } else {
    badge.textContent = botState;
    badge.className = 'mode-badge mode-stopped';
  }

  const running = botState === 'RUNNING' || botState === 'STARTING';
  const stopped = botState === 'STOPPED' || botState === 'ERROR';
  document.getElementById('config-section').classList.toggle('hidden', running);
  document.getElementById('stop-section').classList.toggle('hidden', !running);
  document.getElementById('symbols-section').classList.toggle('hidden', stopped);
  document.getElementById('timeline-section').classList.toggle('hidden', stopped);
  document.getElementById('export-section').classList.toggle('hidden', stopped);
  document.getElementById('summary-bar').classList.toggle('hidden', stopped);
  document.getElementById('test-label').classList.toggle('hidden', stopped || d.trade_limits_enabled);

  // Show error message
  const errEl = document.getElementById('error-msg');
  if (d.error && botState === 'ERROR') {
    errEl.textContent = d.error;
    errEl.classList.remove('hidden');
  } else {
    errEl.classList.add('hidden');
  }

  const connInfo = [];
  if (d.ibkr_connected) connInfo.push('IBKR');
  if (d.paper_verified) connInfo.push('Paper ✓');
  document.getElementById('conn-info').textContent = connInfo.join(' · ');

  if (d.enabled_symbols !== undefined) document.getElementById('stat-symbols').textContent = d.enabled_symbols;
  if (d.total_open_positions !== undefined) document.getElementById('stat-open').textContent = d.total_open_positions;
}

function updateSymbols(symbols) {
  const container = document.getElementById('symbol-cards');
  const activeContainer = document.getElementById('active-trades');
  let html = '';
  let activeHtml = '';
  let hasActive = false;

  for (const s of symbols) {
    const isActive = s.lifecycle === 'POSITION_OPEN' || s.lifecycle === 'EXIT_SUBMITTED' || s.lifecycle === 'ENTRY_SUBMITTED';
    const cls = isActive ? 'card active-card' : 'card';
    let detail = '';
    if (s.direction) detail += s.direction;
    if (s.option_right) detail += ' / ' + (s.option_right === 'C' ? 'CALL' : 'PUT');
    if (s.option_expiration) detail += ' ' + s.option_expiration;
    if (s.option_strike) detail += ' ' + s.option_strike;

    let levels = '';
    if (s.underlying_entry) levels = `E ${s.underlying_entry.toFixed(2)} · S ${s.underlying_stop.toFixed(2)} · T ${s.underlying_target.toFixed(2)}`;

    let ctx = '';
    let parts = [];
    if (s.pdh != null && s.pdl != null) parts.push(`PDH ${s.pdh.toFixed(2)} · PDL ${s.pdl.toFixed(2)}`);
    if (s.pmh != null && s.pml != null) {
      let pmLabel = `PMH ${s.pmh.toFixed(2)} · PML ${s.pml.toFixed(2)}`;
      if (s.premarket_final === false) pmLabel += ' · BUILDING';
      parts.push(pmLabel);
    }
    ctx = parts.join(' | ');

    const stateClass = s.lifecycle === 'DONE_FOR_DAY' ? 'color:var(--dim)' :
                       isActive ? 'color:var(--accent)' : '';

    // Feed health indicator
    let feedLabel = '';
    if (s.feed_status === 'STALE') feedLabel = '<span style="color:var(--red);font-size:11px;margin-left:6px">STALE</span>';
    else if (s.feed_status === 'LIVE') feedLabel = '<span style="color:var(--green);font-size:11px;margin-left:6px">LIVE</span>';
    else if (s.feed_status === 'INITIALIZING') feedLabel = '<span style="color:var(--dim);font-size:11px;margin-left:6px">INIT</span>';

    // Current state: use new current_state if available, else fallback to lifecycle
    let mainState = s.lifecycle || '—';
    if (s.current_state && !isActive) {
      mainState = s.current_state;
    }
    mainState = mainState.replace(/_/g, ' ');

    html += `<div class="${cls}"><div class="sym-card"><span class="sym-name">${s.symbol}${feedLabel}</span><span class="sym-state" style="${stateClass}">${s.enabled ? mainState : 'DISABLED'}</span></div>`;
    if (detail) html += `<div class="sym-detail">${detail}</div>`;
    // ORB levels
    if (s.orb_high != null) html += `<div class="sym-levels" style="color:var(--accent)">ORB H ${s.orb_high.toFixed(2)} · L ${s.orb_low.toFixed(2)}</div>`;
    if (levels) html += `<div class="sym-levels">${levels}</div>`;
    if (ctx) html += `<div class="sym-levels">${ctx}</div>`;
    // Pipeline detail: show candle_event + direction/displacement info
    if (s.current_state && !isActive) {
      let pipeInfo = '';
      const dir = s.pipeline_stage || '';
      if (s.candle_event) pipeInfo = s.candle_event.replace(/_/g, ' ');
      if (pipeInfo) html += `<div class="sym-detail" style="color:var(--cyan);font-size:11px">Last: ${pipeInfo}</div>`;
    } else if (s.pipeline_stage) {
      html += `<div class="sym-detail" style="color:var(--cyan);font-size:11px">${s.pipeline_stage}</div>`;
    }
    if (!s.enabled && s.error) html += `<div class="sym-detail" style="color:var(--red)">${s.error}</div>`;
    html += '</div>';

    if (isActive) {
      hasActive = true;
      activeHtml += `<div class="card active-card"><div class="sym-card"><span class="sym-name">${s.symbol}</span><span class="sym-state" style="color:var(--accent)">${s.lifecycle.replace(/_/g,' ')}</span></div>`;
      if (detail) activeHtml += `<div class="sym-detail">${detail}</div>`;
      if (levels) activeHtml += `<div class="sym-levels">${levels}</div>`;
      activeHtml += '</div>';
    }
  }
  container.innerHTML = html;
  activeContainer.innerHTML = activeHtml;
  document.getElementById('active-section').classList.toggle('hidden', !hasActive);
}

function appendEvents(events) {
  if (!events.length) return;
  const container = document.getElementById('timeline');
  for (const e of events) {
    if (e.seq > lastSeq) lastSeq = e.seq;
    const div = document.createElement('div');
    div.className = 'event';
    // Convert to Central Time for display
    let ts = '';
    if (e.timestamp_ms) {
      const d = new Date(e.timestamp_ms);
      ts = d.toLocaleTimeString('en-US', {timeZone:'America/Chicago', hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }
    const sym = e.symbol ? `<span class="event-sym">${e.symbol}</span>` : '';
    let cls = '';
    let text = e.event_type.replace(/_/g,' ');
    const d = e.data || {};

    if (e.event_type === 'SIGNAL' || e.event_type === 'OBSERVE_ENTRY') cls = 'event-signal';
    if (e.event_type === 'TRADE_WIN' || e.event_type === 'OBSERVE_TARGET') cls = 'event-win';
    if (e.event_type === 'TRADE_LOSS' || e.event_type === 'OBSERVE_STOP') cls = 'event-loss';
    if (e.event_type.includes('TRIGGERED')) cls = 'event-trigger';

    // Enrich display
    if (e.event_type === 'SIGNAL' && e.direction) text += ' ' + e.direction;
    if (e.event_type === 'OPTION_SELECTED' && d.strike) text = `${d.right === 'C' ? 'CALL' : 'PUT'} ${d.strike} selected — Bid ${d.bid} / Ask ${d.ask}`;
    if (e.event_type === 'ENTRY_ORDER_BUILT' && d.limit_price) text = `BUY 1 LMT @ ${d.limit_price}`;
    if (e.event_type === 'ENTRY_SUBMITTED') text = 'ENTRY SUBMITTED';
    if (e.event_type === 'ENTRY_FILLED' && d.fill_price) text = `FILLED @ ${d.fill_price}`;
    if (e.event_type === 'EXIT_FILLED' && d.fill_price) text = `EXIT FILLED @ ${d.fill_price}`;
    if (e.event_type === 'TRADE_COMPLETED') {
      text = `${d.result} — PnL $${d.gross_pnl !== undefined ? d.gross_pnl.toFixed(0) : '?'}`;
      cls = d.result === 'WIN' ? 'event-win' : 'event-loss';
    }

    // Premarket context — audit timeline only, factual note, no signal styling
    let pmHtml = '';
    if (e.event_type === 'SYMBOL_ENABLED' && d.premarket_context && Object.keys(d.premarket_context).length) {
      const pmLines = [];
      for (const dir of ['LONG', 'SHORT']) {
        const info = d.premarket_context[dir];
        if (!info) continue;
        const levelLabel = info.level_source === 'PREVIOUS_DAY_HIGH' ? 'PDH'
                          : info.level_source === 'PREVIOUS_DAY_LOW' ? 'PDL'
                          : (dir === 'LONG' ? 'PDH' : 'PDL');
        let line = null;
        if (info.break_origin === 'NONE') {
          line = `${levelLabel}: No premarket break observed`;
        } else if (info.break_origin === 'PREMARKET_OBSERVED') {
          if (info.break_timestamp_ms) {
            const bts = new Date(info.break_timestamp_ms).toLocaleTimeString('en-US', {timeZone:'America/Chicago', hour12:false, hour:'2-digit', minute:'2-digit'});
            line = `${levelLabel}: Premarket break observed at ${bts} CT`;
          } else {
            line = `${levelLabel}: Premarket break observed`;
          }
        } else if (info.break_origin === 'PREMARKET_CARRY_IN') {
          line = `${levelLabel}: Already beyond level on first premarket bar`;
        }
        // Unknown break_origin: omit this direction, never invent text
        if (line) pmLines.push(line);
      }
      if (pmLines.length) pmHtml = pmLines.map(l => `<div class="sym-detail">${l}</div>`).join('');
    }

    div.innerHTML = `<span class="event-time">${ts}</span>${sym}<span class="event-high ${cls}">${text}</span>${pmHtml}`;
    container.insertBefore(div, container.firstChild);
  }
}

function updateSession(d) {
  document.getElementById('stat-trades').textContent = d.trade_completed_count || 0;
  document.getElementById('stat-wins').textContent = d.wins || 0;
  document.getElementById('stat-losses').textContent = d.losses || 0;
  if (d.total_open_positions !== undefined) document.getElementById('stat-open').textContent = d.total_open_positions;
}

// Export
function exportJSON() { window.open(API + '/api/session/export.json', '_blank'); }
function exportMD() { window.open(API + '/api/session/export.md', '_blank'); }

// ── Journal ────────────────────────────────────────────────────────
// Everything here is display only. Every number comes straight from
// /api/trades; nothing is recomputed in the browser, and a value the
// backend could not determine renders as an em dash, never as 0.
const EMPTY = '\u2014';

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isNum(v) { return typeof v === 'number' && isFinite(v); }

// P&L is only ever shown when the backend actually persisted one.
function fmtPnl(v) {
  if (!isNum(v)) return {text: EMPTY, cls: 'pnl-none'};
  const sign = v > 0 ? '+' : v < 0 ? '\u2212' : '';
  return {
    text: sign + '$' + Math.abs(v).toFixed(2),
    cls: v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : 'pnl-none',
  };
}

// null means "nothing decided yet" — distinct from a 0% win rate.
function fmtRate(v) { return isNum(v) ? Math.round(v * 100) + '%' : EMPTY; }

function fmtPrice(v) {
  if (isNum(v)) return v.toFixed(2);
  // PriceTicks contract: {ticks, tick_size}
  if (v && isNum(v.ticks)) {
    const ts = parseFloat(v.tick_size);
    if (isFinite(ts)) return (v.ticks * ts).toFixed(2);
  }
  return EMPTY;
}

function fmtTime(ms, tz) {
  if (!isNum(ms)) return EMPTY;
  try {
    return new Date(ms).toLocaleTimeString('en-GB', {
      hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: tz || 'America/New_York',
    });
  } catch (e) { return EMPTY; }
}

function fmtDate(ms, tz) {
  if (!isNum(ms)) return EMPTY;
  try {
    return new Date(ms).toLocaleDateString('en-CA', {
      timeZone: tz || 'America/New_York',
    });
  } catch (e) { return EMPTY; }
}

function tradeSession(t) {
  const sess = (t.setup_snapshot || {}).session || {};
  const tz = sess.market_timezone || 'America/New_York';
  return {tz, date: sess.date || fmtDate(t.entry_timestamp_ms, tz)};
}

// One record -> one visual state. Never inferred: a missing outcome
// stays missing.
function tradeKind(t) {
  const state = t.state || '';
  if (state === 'REQUIRES_ATTENTION') return 'attn';
  if (state === 'OPEN') {
    return t.history_status === 'LEGACY_OPEN' ? 'legacy' : 'open';
  }
  if (state === 'CLOSED') {
    const r = (t.outcome || {}).result;
    if (r === 'WIN') return 'win';
    if (r === 'LOSS') return 'loss';
    return 'closed';
  }
  return 'open';
}

const KIND_LABEL = {
  win: 'Closed \u00b7 Win', loss: 'Closed \u00b7 Loss', closed: 'Closed',
  open: 'Open', attn: 'Requires attention', legacy: 'Legacy \u00b7 not migrated',
};
const KIND_BADGE = {
  win: 'badge-win', loss: 'badge-loss', closed: 'badge-open',
  open: 'badge-open', attn: 'badge-attn', legacy: 'badge-legacy',
};

function perfCard(label, p) {
  p = p || {};
  const pnl = fmtPnl(p.gross_pnl);
  const closed = isNum(p.closed_trades) ? p.closed_trades : 0;
  const w = isNum(p.wins) ? p.wins : 0;
  const l = isNum(p.losses) ? p.losses : 0;
  const unpriced = isNum(p.closed_without_pnl) ? p.closed_without_pnl : 0;
  const note = unpriced ? ' \u00b7 ' + unpriced + ' unpriced' : '';
  return `<div class="perf-card">
    <div class="perf-period">${esc(label)}</div>
    <div class="perf-pnl ${pnl.cls}">${pnl.text}</div>
    <div class="perf-meta">${closed} closed${esc(note)}</div>
    <div class="perf-meta">${w}W / ${l}L \u00b7 ${fmtRate(p.win_rate)}</div>
  </div>`;
}

function renderPerformance(perf) {
  const cards = document.getElementById('perf-cards');
  const noteEl = document.getElementById('perf-note');
  const counters = document.getElementById('perf-counters');
  if (!perf) {
    // Older backend without the performance block: show the journal
    // list rather than fabricating zeros.
    cards.innerHTML = '';
    noteEl.textContent = '';
    counters.innerHTML = '';
    return;
  }
  cards.innerHTML = perfCard('Today', perf.today)
    + perfCard('This week', perf.week)
    + perfCard('This month', perf.month);

  const note = perf.gross_pnl_note ? ' \u00b7 ' + perf.gross_pnl_note : '';
  noteEl.textContent = 'Gross P&L' + note;

  const chips = [];
  if (isNum(perf.open_count) && perf.open_count > 0)
    chips.push(`<span class="chip chip-open">${perf.open_count} open</span>`);
  if (isNum(perf.attention_count) && perf.attention_count > 0)
    chips.push(`<span class="chip chip-attn">${perf.attention_count} requires attention</span>`);
  if (isNum(perf.legacy_open_count) && perf.legacy_open_count > 0)
    chips.push(`<span class="chip">${perf.legacy_open_count} legacy open</span>`);
  counters.innerHTML = chips.join('');
}

function tradeDetails(t) {
  const snap = t.setup_snapshot;
  if (!snap) {
    return '<div class="jrn-kv"><span>Setup details unavailable for legacy record</span><span></span></div>';
  }
  const tz = tradeSession(t).tz;
  const rows = [
    ['Level', esc(snap.level_source || EMPTY) + ' @ ' + fmtPrice(snap.level_price)],
    ['Break bar', fmtTime((snap.break_bar || {}).bar_utc_ms, tz)],
    ['Displacement', isNum(snap.displacement_bar_count) ? snap.displacement_bar_count + ' bars' : EMPTY],
    ['Retest', isNum(snap.retest_bar_count) ? snap.retest_bar_count + ' bars' : EMPTY],
    ['Entry candle', fmtTime((snap.confirmation_bar || {}).bar_utc_ms, tz)],
    ['Pattern', esc(snap.entry_pattern_type || EMPTY)],
  ];
  return rows.map(r =>
    `<div class="jrn-kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}

function tradeCard(t) {
  const kind = tradeKind(t);
  const sess = tradeSession(t);
  const snap = t.setup_snapshot || {};
  const outcome = t.outcome || {};

  // A trade without a confirmed exit has no P&L — show nothing, not $0.
  const pnl = (kind === 'win' || kind === 'loss' || kind === 'closed')
    ? fmtPnl(outcome.gross_pnl) : {text: '', cls: ''};

  const levels = [
    ['E', t.underlying_entry], ['S', t.stop], ['T', t.target],
  ].map(x => x[0] + ' ' + fmtPrice(x[1])).join('  \u00b7  ');

  const src = snap.level_source ? ' \u00b7 ' + esc(snap.level_source) : '';
  const pat = snap.entry_pattern_type
    ? ' \u00b7 ' + esc(String(snap.entry_pattern_type).replace(/_/g, ' ').toLowerCase())
    : '';

  return `<div class="jrn jrn-${kind}">
    <div class="jrn-top">
      <div><span class="jrn-sym">${esc(t.symbol || '?')}</span><span class="jrn-dir">${esc(t.direction || '')}</span></div>
      <div class="jrn-pnl ${pnl.cls}">${pnl.text}</div>
    </div>
    <div class="jrn-sub">${esc(sess.date)}${src}${pat}</div>
    <div class="jrn-sub">${levels}</div>
    <span class="jrn-badge ${KIND_BADGE[kind]}">${KIND_LABEL[kind]}</span>
    <details class="jrn-det"><summary>Details</summary>${tradeDetails(t)}</details>
  </div>`;
}

function renderJournal(d) {
  d = d || {};
  renderPerformance(d.performance);
  const list = document.getElementById('journal-list');
  const trades = Array.isArray(d.trades) ? d.trades : [];
  if (!trades.length) {
    list.innerHTML = '<div class="jrn-empty">No trades recorded yet.</div>';
    return;
  }
  // Backend already returns newest-first; order is not recomputed here.
  list.innerHTML = trades.map(t => {
    try { return tradeCard(t); } catch (e) { return ''; }
  }).join('');
}

let journalLoaded = false;

// Deliberately NOT gated on botState: persisted history is exactly what
// must stay readable while the bot is stopped.
async function pollTrades() {
  try {
    const r = await fetch(API + '/api/trades');
    if (!r.ok) throw new Error('trades ' + r.status);
    renderJournal(await r.json());
    journalLoaded = true;
  } catch (e) {
    if (!journalLoaded) {
      document.getElementById('journal-list').innerHTML =
        '<div class="jrn-empty">Journal unavailable \u2014 retrying\u2026</div>';
    }
  }
}

// Service worker
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// Start polling
setInterval(pollStatus, 2000);
setInterval(pollSymbols, 2000);
setInterval(pollEvents, 1000);
setInterval(pollSession, 3000);
// Historical data: slower cadence, and it runs whether or not the bot
// is running.
setInterval(pollTrades, 8000);
pollStatus();
pollTrades();
</script>
